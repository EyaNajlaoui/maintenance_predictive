<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PrognosIA{% endblock %} — Diagnostic et prévision moteur</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand__mark">Pr</span>
        PrognosIA
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Accueil</a>
        <a href="{{ url_for('diagnostic') }}" class="{{ 'active' if request.endpoint == 'diagnostic' }}">Diagnostic</a>
        <a href="{{ url_for('methodologie') }}" class="{{ 'active' if request.endpoint == 'methodologie' }}">Méthodologie</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    PrognosIA — Diagnostic et prévision de fiabilité moteur, à partir du jeu de données NASA C-MAPSS (FD002).
  </footer>
</body>
</html>
